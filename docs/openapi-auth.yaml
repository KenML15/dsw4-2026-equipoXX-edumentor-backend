openapi: 3.0.3
info:
  title: EduMentor Hub API - Módulo de Seguridad y Usuarios
  version: 1.0.0
  description: Endpoints de autenticación JWT y gestión de perfil de usuario (Persona 1).

paths:
  /api/auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar un nuevo usuario en la plataforma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Datos inválidos o correo/carné duplicado (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Error interno del servidor (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión y obtener token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Error de validación en los campos enviados (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Credenciales inválidas (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Error interno del servidor (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/usuarios/me:
    get:
      tags:
        - Usuarios
      summary: Obtener el perfil del usuario autenticado actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario recuperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          description: Token ausente, expirado o inválido (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Sin permisos para acceder al recurso (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Usuario no encontrado (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Error interno del servidor (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Rol:
      type: string
      enum: [ESTUDIANTE, TUTOR, COORDINADOR]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: estudiante@ucr.ac.cr
        password:
          type: string
          example: secret

    RegisterRequest:
      type: object
      required: [carne, email, password, nombre, apellido, rol]
      properties:
        carne:
          type: string
          maxLength: 20
          example: C5H153
        email:
          type: string
          format: email
          example: nuevo@ucr.ac.cr
        password:
          type: string
          minLength: 6
          example: clave123
        nombre:
          type: string
          example: Kenneth
        apellido:
          type: string
          example: Miranda
        rol:
          $ref: '#/components/schemas/Rol'

    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        carne:
          type: string
          example: C5H153
        email:
          type: string
          example: estudiante@ucr.ac.cr
        nombre:
          type: string
          example: Kenneth
        apellido:
          type: string
          example: Miranda
        rol:
          $ref: '#/components/schemas/Rol'

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        usuario:
          $ref: '#/components/schemas/UsuarioResponse'

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: No autenticado
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: Debe iniciar sesión o proporcionar un token JWT válido
        instance:
          type: string
          format: uri
          example: /api/usuarios/me