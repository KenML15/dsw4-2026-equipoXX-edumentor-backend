spring.application.name=edumentor-backend
server.port=8080

# Configuración Base de Datos H2 (Local sin Docker)
spring.datasource.url=jdbc:h2:mem:edumentordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Consola H2 (útil para desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Propiedades JWT personalizadas
jwt.secret=ClaveSecretaSuperSeguraParaEduMentorHub2026UCRParaiso123456
jwt.expiration=86400000